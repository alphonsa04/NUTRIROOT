<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts | NutriRoot</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/alerts.css">
    <link rel="stylesheet" href="css/chatbot.css">
    <link rel="stylesheet" href="css/mobile.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validation-utils.js"></script>
    <script src="js/admin-auth.js"></script>
</head>

<body>
    <!-- Top Navigation Block -->
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand" style="text-decoration: none;">
            <div class="nutriroot-logo-text">
                <span class="logo-part">NUTR</span>
                <span class="logo-plant-container">
                    <img src="assets/images/tree-logo.png" alt="Tree" class="logo-plant-img">
                </span>
                <span class="logo-part">ROOT</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Dashboard
            </a>
            <a href="recommendation.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2.69l5.74 5.88-5.74 5.88-5.74-5.88z"></path>
                    <path d="M2 22h20"></path>
                </svg>
                Fertilizer
            </a>
            <a href="crops.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Crops
            </a>
            <a href="shop.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Shop
            </a>
            <a href="history.html" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
                    <polyline points="17 18 23 18 23 12"></polyline>
                </svg>
                History
            </a>
            <a href="alerts.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                Alerts
                <span class="nav-notification-badge" id="alertBadge" style="display: none;"></span>
            </a>
        </div>

        <div class="user-profile">
            <button class="btn-icon" onclick="toggleProfileMenu()" id="profileBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" onclick="toggleMobileNav()" style="margin-left: 10px;">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div id="profileMenu" class="dropdown-menu">
                <div class="dropdown-header">
                    <div class="user-name">
                        <span id="dropdownUserName">User</span><span id="premiumBadge" class="premium-badge-dropdown"
                            style="display: none;">PRO</span>
                    </div>
                    <span class="user-email" id="dropdownUserEmail">email@example.com</span>
                </div>

                <a href="#" onclick="signOut()" class="dropdown-item danger">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sign Out
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="dashboard-header">
            <div>
                <h1 class="page-title">Notification Center</h1>
                <p class="page-subtitle">Stay updated with your farm's health and system status</p>
            </div>
        </div>

        <!-- Alert Summary Section -->
        <div class="alerts-summary">
            <div class="summary-card total">
                <div class="summary-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
                <div class="summary-info">
                    <h4>Total Alerts</h4>
                    <div class="summary-value" id="statsTotal">0</div>
                </div>
            </div>

            <div class="summary-card critical">
                <div class="summary-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="summary-info">
                    <h4>Critical</h4>
                    <div class="summary-value" id="statsCritical">0</div>
                </div>
            </div>

            <div class="summary-card soil">
                <div class="summary-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2z"></path>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                </div>
                <div class="summary-info">
                    <h4>Soil Health</h4>
                    <div class="summary-value" id="statsSoil">0</div>
                </div>
            </div>

            <div class="summary-card system">
                <div class="summary-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                        </path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div class="summary-info">
                    <h4>System</h4>
                    <div class="summary-value" id="statsSystem">0</div>
                </div>
            </div>
        </div>

        <!-- Tab Filters -->
        <div class="alerts-tabs-container">
            <button class="tab-btn active" data-filter="all">
                <span>All Alerts</span>
                <span class="tab-count" id="countAll">0</span>
            </button>
            <button class="tab-btn" data-filter="critical">
                <span>Critical</span>
                <span class="tab-count" id="countCritical">0</span>
            </button>
            <button class="tab-btn" data-filter="soil">
                <span>Soil Health</span>
                <span class="tab-count" id="countSoil">0</span>
            </button>
            <button class="tab-btn" data-filter="weather">
                <span>Weather</span>
                <span class="tab-count" id="countWeather">0</span>
            </button>
            <button class="tab-btn" data-filter="system">
                <span>System</span>
                <span class="tab-count" id="countSystem">0</span>
            </button>
        </div>

        <div id="alertsContainer" class="alerts-container">
            <!-- Alerts will be dynamically inserted here in a timeline format -->
            <div class="loader-container">
                <div class="loader-spinner"></div>
                <p>Initializing your notification center...</p>
            </div>
        </div>
    </div>
    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="dashboard.html" class="mobile-nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="shop.html" class="mobile-nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Shop</span>
        </a>
        <a href="crops.html" class="mobile-nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>Crops</span>
        </a>
        <a href="alerts.html" class="mobile-nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Alerts</span>
        </a>
    </div>

    <script src="js/script.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/ai-chatbot.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</body>

</html>
