<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Approvals | NutriRoot Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/mobile.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validation-utils.js"></script>
    <script src="js/admin-auth.js"></script>
</head>

<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <a href="admin.html" class="navbar-brand"
            style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <div class="nutriroot-logo-text">
                <span class="logo-part">NUTR</span>
                <span class="logo-plant-container">
                    <img src="assets/images/tree-logo.png" alt="Tree" class="logo-plant-img">
                </span>
                <span class="logo-part">ROOT</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="admin.html" class="nav-link">Dashboard</a>
            <a href="admin-seller-requests.html" class="nav-link">Sellers</a>
            <a href="admin-product-approvals.html" class="nav-link active">Products</a>
            <a href="admin-users.html" class="nav-link">Users</a>
        </div>

        <div class="user-profile">
            <button class="btn-icon" onclick="signOut()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" onclick="toggleMobileNav()" style="margin-left: 10px;">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1 class="admin-title">Product Verification</h1>
                <p class="admin-subtitle">Review and approve vendor products for the marketplace</p>
            </div>
        </div>

        <div class="admin-table-container">
            <div class="admin-table-header">
                <h2 class="admin-table-title">Pending Approvals</h2>
                <div class="admin-actions">
                    <button class="btn btn-outline btn-sm"
                        onclick="AdminProductApprovals.loadPendingProducts()">Refresh</button>
                </div>
            </div>
            <div class="admin-table-wrapper" style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Seller / Shop</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>NPK</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pendingProductsBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 3rem; color: var(--secondary-color);">
                                <div class="loader" style="margin: 0 auto 1rem;"></div>
                                Loading pending products...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productDetailOverlay" class="admin-modal-overlay">
        <div id="productDetailModal" class="admin-modal" style="width: 600px; padding: 0;">
            <div class="admin-modal-header"
                style="border-bottom: 1px solid #F4F7FE; padding: 1.5rem 2rem; margin-bottom: 0;">
                <h3 id="modalProductName" class="admin-modal-title" style="margin: 0; font-size: 1.25rem;">Product
                    Details</h3>
                <button class="admin-modal-close" onclick="AdminProductApprovals.closeModal()">&times;</button>
            </div>
            <div id="modalBody" style="padding: 1.5rem; max-height: 60vh; overflow-y: auto;">
                <!-- Content injected via JS -->
            </div>
            <div class="admin-form-actions"
                style="padding: 1.5rem; background: #F9FAFC; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; border-top: 1px solid #F4F7FE; margin-top: 0;">
                <button class="btn btn-outline" onclick="AdminProductApprovals.handleAction('rejected')"
                    style="color: var(--accent-red); border-color: #FFCCCC; background: white;">Reject Product</button>
                <button class="btn btn-primary" onclick="AdminProductApprovals.handleAction('approved')"
                    style="background: var(--accent-green); border: none;">Approve for Marketplace</button>
            </div>
        </div>
    </div>

    <script src="js/admin-product-approvals.js"></script>
</body>

</html>
