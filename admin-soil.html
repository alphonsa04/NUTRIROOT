<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Data Submissions | NutriRoot Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-auth.js"></script>
</head>

<body>
    <!-- Top Navigation -->
    <nav class="navbar">
        <a href="admin.html" class="navbar-brand"
            style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <div class="nutriroot-logo-text">
                <span class="logo-part">NUTR</span>
                <span class="logo-plant-container">
                    <img src="assets/images/tree-logo.png" alt="Tree" class="logo-plant-img">
                </span>
                <span class="logo-part">ROOT</span>
            </div>
            <span
                style="font-weight: 600; color: var(--secondary-color); font-size: 0.9rem; border-left: 1px solid #E0E5F2; padding-left: 10px;">Admin</span>
        </a>

        <div class="user-profile">
            <button class="btn-icon" onclick="toggleProfileMenu()" id="profileBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <div class="admin-sidebar-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                Admin Panel
            </div>
        </div>
        <nav class="admin-nav-links">
            <a href="admin.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Overview
            </a>
            <a href="admin-seller-requests.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <polyline points="17 11 19 13 23 9"></polyline>
                </svg>
                Seller Requests
                <span id="badgeSellers" class="nav-badge">0</span>
            </a>
            <a href="admin-messages.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Messages
                <span id="badgeMessages" class="nav-badge">0</span>
            </a>
            <a href="admin-users.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                </svg>
                Users
            </a>
            <a href="admin-crops.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                Crops
            </a>
            <a href="admin-analytics.html" class="admin-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                Analytics
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main-content">
        <div class="dashboard-header">
            <div>
                <h1 class="page-title">Soil Data Submissions</h1>
                <p class="page-subtitle">Track and analyze all IoT sensor data submissions from users</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="loadSoilData()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6"></path>
                        <path d="M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Charts Grid -->
        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <div class="admin-table-container">
                <h3 class="admin-table-title" style="margin-bottom: 1rem;">pH Level Distribution</h3>
                <div style="height: 250px;">
                    <canvas id="phDistributionChart"></canvas>
                </div>
            </div>
            <div class="admin-table-container">
                <h3 class="admin-table-title" style="margin-bottom: 1rem;">NPK Averages</h3>
                <div style="height: 250px;">
                    <canvas id="npkAveragesChart"></canvas>
                </div>
            </div>
        </div>

        <div class="admin-table-container">
            <div class="admin-table-header">
                <h2 class="admin-table-title">All Submissions</h2>
                <button class="btn btn-outline" onclick="exportSoilData()">Export to CSV</button>
            </div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>User</th>
                            <th>pH</th>
                            <th>N-P-K</th>
                            <th>Moisture</th>
                            <th>Temp</th>
                            <th>Recommendation</th>
                        </tr>
                    </thead>
                    <tbody id="soilDataTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 2rem;">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let phChart, npkChart;
        let userMap = {};

        async function loadSoilData() {
            if (typeof db === 'undefined') return;

            try {
                // Fetch user map first (to resolve existing 'Anonymous' entries)
                const usersSnapshot = await db.collection('users').get();
                usersSnapshot.forEach(doc => {
                    const data = doc.data();
                    userMap[doc.id] = data.name || data.displayName || 'Farmer';
                });

                const snapshot = await db.collectionGroup('readings').orderBy('timestamp', 'desc').get();
                const tableBody = document.getElementById('soilDataTableBody');

                if (snapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">No submissions found.</td></tr>';
                    return;
                }

                const docs = snapshot.docs.map(doc => {
                    const d = doc.data();
                    // Resolve name from map if missing in the reading document
                    if (!d.userName && d.userId) {
                        d.userName = userMap[d.userId] || 'Anonymous';
                    }
                    return d;
                });

                // Populate Table
                tableBody.innerHTML = docs.map(d => {
                    const date = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : new Date(d.timestamp).toLocaleString()) : 'N/A';
                    return `
                        <tr>
                            <td>${date}</td>
                            <td><span style="color: var(--primary-color); font-weight: 500;">${d.userName || 'Anonymous'}</span></td>
                            <td><span style="font-weight: 600;">${d.ph || 0}</span></td>
                            <td>${d.nitrogen || 0}-${d.phosphorus || 0}-${d.potassium || 0}</td>
                            <td>${d.moisture || 0}%</td>
                            <td>${d.temperature || 0}°C</td>
                            <td>${d.recommendedCrop || 'N/A'}</td>
                        </tr>
                    `;
                }).join('');

                renderSoilCharts(docs);
                updateBadges();

            } catch (err) {
                console.error('Error loading soil data:', err);
                document.getElementById('soilDataTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--accent-red);">Error loading data.</td></tr>';
            }
        }

        function renderSoilCharts(docs) {
            const phLevels = docs.map(d => parseFloat(d.ph) || 0);
            const nValues = docs.map(d => parseFloat(d.nitrogen) || 0);
            const pValues = docs.map(d => parseFloat(d.phosphorus) || 0);
            const kValues = docs.map(d => parseFloat(d.potassium) || 0);

            const nAvg = nValues.reduce((a, b) => a + b, 0) / nValues.length;
            const pAvg = pValues.reduce((a, b) => a + b, 0) / pValues.length;
            const kAvg = kValues.reduce((a, b) => a + b, 0) / kValues.length;

            // pH Distribution
            if (phChart) phChart.destroy();
            phChart = new Chart(document.getElementById('phDistributionChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Acidic (<6)', 'Neutral (6-7.5)', 'Alkaline (>7.5)'],
                    datasets: [{
                        data: [
                            phLevels.filter(p => p < 6).length,
                            phLevels.filter(p => p >= 6 && p <= 7.5).length,
                            phLevels.filter(p => p > 7.5).length
                        ],
                        backgroundColor: ['#FF5630', '#05CD99', '#4318FF']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // NPK Averages
            if (npkChart) npkChart.destroy();
            npkChart = new Chart(document.getElementById('npkAveragesChart'), {
                type: 'bar',
                data: {
                    labels: ['Nitrogen', 'Phosphorus', 'Potassium'],
                    datasets: [{
                        label: 'Average kg/ha',
                        data: [nAvg, pAvg, kAvg],
                        backgroundColor: ['#4285F4', '#05CD99', '#FFBB00']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        async function updateBadges() {
            try {
                const sellerSnap = await db.collection('users').where('role', '==', 'seller').where('shopStatus', '==', 'pending').get();
                const sellerBadge = document.getElementById('badgeSellers');
                if (sellerSnap.size > 0) {
                    sellerBadge.textContent = sellerSnap.size;
                    sellerBadge.classList.add('active');
                }

                const msgSnap = await db.collection('messages').where('status', '==', 'unread').get();
                const msgBadge = document.getElementById('badgeMessages');
                if (msgSnap.size > 0) {
                    msgBadge.textContent = msgSnap.size;
                    msgBadge.classList.add('active');
                }
            } catch (err) { console.error(err); }
        }

        function exportSoilData() {
            const table = document.querySelector('table');
            let csv = [];
            const rows = table.querySelectorAll('tr');

            for (const row of rows) {
                const cols = row.querySelectorAll('td, th');
                const rowData = Array.from(cols).map(c => `"${c.innerText}"`).join(',');
                csv.push(rowData);
            }

            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nutriroot-soil-submissions.csv';
            a.click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadSoilData, 1000);
        });
    </script>
</body>

</html>
